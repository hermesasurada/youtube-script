<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <title>이력조회</title>
  <!-- 작은 로컬 marked는 선로드하고, 본문용 웹폰트·KaTeX는 요약 뒤에 로딩한다. -->
  <style>
    @font-face {
      font-family: "Chosunilbo_myungjo";
      src: url("/static/fonts/ChosunilboNM.woff?v={{ static_v('fonts/ChosunilboNM.woff') }}") format("woff");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg:        #f7f7f8;
      --surface:   #ffffff;
      --surface2:  #ececef;
      --text:      #1a1a1c;
      --muted:     #6b6b73;
      --border:    #e2e2e6;
      --border-strong: #c8c8cf;
      --highlight: #b07a25;
      --highlight-soft: rgba(176,122,37,.10);
      --radius:    2px;
      --radius-sm: 2px;
      --row-sel:   rgba(176,122,37,.12);
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #0f0f10;
        --surface:   #1a1a1c;
        --surface2:  #232326;
        --text:      #ececef;
        --muted:     #9a9aa2;
        --border:    #2c2c30;
        --border-strong: #3d3d42;
        --highlight: #e0a64a;
        --highlight-soft: rgba(224,166,74,.14);
        --row-sel:   rgba(224,166,74,.16);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      font-size: 15px; line-height: 1.45; }
    a { color: inherit; }

    /* 헤더 */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: .6rem;
      padding: env(safe-area-inset-top) .9rem .55rem;
      padding-top: max(env(safe-area-inset-top), .55rem);
      background: color-mix(in oklab, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .topbar h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; flex: 1; }
    .topbar .count { font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); }
    .icon-btn {
      width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
      color: var(--text); cursor: pointer;
    }
    .icon-btn:active { background: var(--surface2); }
    .icon-btn.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 검색 바 */
    .search {
      padding: .55rem .9rem .45rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      gap: .5rem;
      align-items: center;
    }
    .search input {
      flex: 1;
      min-width: 0;
      height: 38px;
      box-sizing: border-box;
      padding: 0 .75rem;
      font: inherit; color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
    }
    .search input:focus { border-color: var(--highlight); }
    .sort-select {
      flex-shrink: 0; height: 38px; box-sizing: border-box;
      padding: 0 .4rem; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--muted); font: inherit; font-size: 13px;
    }
    .sort-toggle {
      flex-shrink: 0; height: 38px; box-sizing: border-box; white-space: nowrap;
      padding: 0 .7rem; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font: inherit; font-size: 13px; cursor: pointer;
    }
    .sort-toggle:active { background: var(--surface2); }
    /* 정렬 기준이 기본값(전사처리일)이 아닐 때 강조 */
    .sort-toggle.active { color: var(--highlight); border-color: var(--highlight); background: var(--highlight-soft); }

    /* PTR */
    .ptr {
      height: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 11.5px; color: var(--muted);
      transition: height .15s;
    }
    .ptr.visible { height: 38px; }

    /* 카드 1열 */
    .hist-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: .9rem;
      padding: .85rem .9rem 2.2rem;
    }
    .hist-card {
      display: flex; flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .hist-card-clickable:active { background: var(--surface2); }
    .hist-thumb-wrap {
      position: relative; aspect-ratio: 16/9;
      background: var(--surface2); overflow: hidden;
    }
    .hist-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hist-thumb-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 11px; background: var(--surface2);
    }
    .hist-thumb-dur {
      position: absolute; right: .45rem; bottom: .45rem;
      background: rgba(0,0,0,.78); color: #fff;
      font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
      padding: .12rem .4rem; border-radius: 2px; letter-spacing: .02em;
    }
    .hist-card-body { display: flex; flex-direction: column; gap: .5rem; padding: .8rem .9rem .85rem; flex: 1; }
    .hist-card-title {
      font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; line-height: 1.4;
      margin: 0; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .hist-card-meta { display: flex; align-items: center; gap: .5rem; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .hist-card-uploader {
      color: var(--text); text-decoration: none; font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
    }
    .hist-card-footer { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-top: .15rem; }
    .hist-card-date { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
    .hist-card-actions { display: flex; gap: .35rem; }
    .hist-icon-btn {
      width: 34px; height: 34px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: transparent; color: var(--muted); cursor: pointer; padding: 0;
      text-decoration: none;
    }
    .hist-icon-btn:active { background: var(--surface2); color: var(--text); }
    .hist-icon-btn svg { display: block; }
    .hist-icon-btn-summary { color: var(--highlight); border-color: var(--highlight); background: var(--highlight-soft); }
    .hist-icon-btn-youtube { color: #c00; }
    @media (prefers-color-scheme: dark) { .hist-icon-btn-youtube { color: #ff4d4d; } }
    .hist-icon-btn:disabled, .hist-icon-btn[disabled] { opacity: .3; pointer-events: none; }

    /* 읽음 여부 */
    .hist-card-unread { border-left: 3px solid var(--highlight); }
    .hist-unread-dot {
      width: 7px; height: 7px;
      background: var(--highlight);
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
      margin-right: 5px;
      vertical-align: middle;
    }
    .hist-icon-btn-read { color: var(--muted); }
    .hist-icon-btn-read.is-read { opacity: .45; }
    .hist-icon-btn-delete { color: var(--muted); }
    .hist-icon-btn-delete:active { color: #dc2626; background: oklch(0.5 0.2 22 / .08); }

    /* 미읽음 필터 버튼 */
    .unread-filter-btn {
      flex-shrink: 0;
      height: 38px;
      box-sizing: border-box;
      padding: 0 .75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--muted);
      font: inherit; font-size: 13px;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .unread-filter-btn.active {
      background: var(--highlight-soft);
      color: var(--highlight);
      border-color: var(--highlight);
      font-weight: 600;
    }

    /* 상태 표시 */
    .state { padding: 2rem 1rem; text-align: center; color: var(--muted); font-size: 13.5px; }
    .sentinel { height: 1px; }

    /* 모달 (요약/전사 보기) */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: none; z-index: 100;
    }
    .modal-backdrop.open { display: block; }
    .modal {
      position: fixed; left: 0; right: 0; bottom: 0; top: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      z-index: 101;
      transform: translateY(100%);
      transition: transform .22s ease;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .modal.open { transform: translateY(0); }
    .modal-hdr {
      display: flex; align-items: center; gap: .6rem;
      padding: .55rem .85rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .modal-hdr h2 {
      margin: 0; font-size: 15px; font-weight: 600; flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* 읽기 진행바(헤더 아래, 스크롤에 따라 채워짐) */
    .read-progress {
      flex-shrink: 0; height: 3px; width: 0%;
      background: linear-gradient(90deg, var(--highlight), color-mix(in oklab, var(--highlight) 55%, var(--text)));
      border-radius: 0 2px 2px 0; transition: width .1s linear; pointer-events: none;
    }
    .modal-body {
      flex: 1; overflow-y: auto;
      padding: 1rem 1rem 2rem;
      font-size: 14px; line-height: 1.62;
      -webkit-overflow-scrolling: touch;
    }
    /* 요약 본문 글자크기: 변수로 조절(-+). 소제목 h1/h2/h3는 고정 px라 영향 없음. */
    .modal-body.markdown { font-size: var(--reader-fs, 14px); }
    .fs-ctrl { display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0; }
    .fs-ctrl[hidden] { display: none; }
    .fs-btn {
      width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font-size: 17px; font-weight: 600;
      line-height: 1; cursor: pointer; padding: 0;
    }
    .fs-btn:active { background: var(--surface2); }
    /* 텔레그램용 복사 — 요약 볼 때만 노출. 복사 후 라벨이 잠깐 텍스트로 바뀐다 */
    .tg-btn {
      min-width: 30px; height: 30px; flex-shrink: 0; padding: 0 .45rem;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font-size: 14px;
      line-height: 1; cursor: pointer;
    }
    .tg-btn[hidden] { display: none; }
    .tg-btn:active { background: var(--surface2); }
    /* 증류 선택 — 제목을 없앤 자리라 auto margin으로 헤더 가장 우측에 붙인다 */
    /* 증류 토글 — 탭할 때마다 채널 따름 → 포함 → 제외로 순환 */
    .distill-ctrl {
      margin-left: auto; flex-shrink: 0;
      display: inline-flex; align-items: center; height: 30px; padding: 0 .5rem;
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
      color: var(--muted); font: inherit; font-size: 12px; white-space: nowrap; cursor: pointer;
    }
    .distill-ctrl[hidden] { display: none; }
    .distill-ctrl:active { background: var(--surface2); }
    .distill-ctrl.set { border-color: var(--highlight); background: var(--highlight-soft);
      color: var(--highlight); font-weight: 600; }
    .distill-ctrl .dist-eff { color: var(--muted); font-size: 11px; font-weight: 400; }
    .tg-btn.done   { color: var(--success, #16a34a); border-color: currentColor; font-size: 11.5px; }
    .tg-btn.warn   { color: #b45309; border-color: currentColor; font-size: 11.5px; }
    .tg-btn.err    { color: var(--error, #dc2626); border-color: currentColor; font-size: 11.5px; }
    .font-ctrl {
      display: inline-flex; align-items: center; flex-shrink: 0;
      height: 30px; padding: 0 .25rem 0 .4rem;
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
    }
    .font-ctrl[hidden] { display: none; }
    .font-ctrl select {
      width: 78px; height: 100%; border: 0; outline: 0;
      appearance: none; -webkit-appearance: none;
      background-color: transparent; color: var(--text);
      font: inherit; font-size: 11.5px; font-weight: 500;
      padding: 0 .9rem 0 0; cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23888' d='M1 1l4 4 4-4'/></svg>");
      background-repeat: no-repeat; background-position: right center;
    }
    /* 데스크톱 요약 팝업과 같은 글꼴 키를 사용한다. */
    .modal[data-reader-font="sans"] .modal-body.markdown {
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }
    .modal[data-reader-font="serif"] .modal-body.markdown {
      font-family: "Noto Serif KR", "Apple Myungjo", Georgia, serif;
    }
    /* Pretendard — self-host 가변 폰트(자간이 촘촘해 좁은 화면에서 특히 잘 읽힌다) */
    .modal[data-reader-font="pretendard"] .modal-body.markdown {
      font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system, sans-serif;
      letter-spacing: -.003em; word-break: keep-all;
    }
    .modal[data-reader-font="chosun"] .modal-body.markdown {
      font-family: "Chosunilbo_myungjo", "Gowun Batang", "Nanum Myeongjo", "Noto Serif KR", serif;
      letter-spacing: -.01em; word-break: keep-all;
    }
    .modal[data-reader-font="chosun"] .modal-body.markdown p,
    .modal[data-reader-font="chosun"] .modal-body.markdown li { line-height: 1.85; }
    .modal[data-reader-font="gowun"] .modal-body.markdown {
      font-family: "Gowun Batang", "Nanum Myeongjo", "Song Myung", "Noto Serif KR", serif;
      letter-spacing: -.01em; word-break: keep-all;
    }
    .modal[data-reader-font="gowun"] .modal-body.markdown p,
    .modal[data-reader-font="gowun"] .modal-body.markdown li { line-height: 1.82; }
    .modal[data-reader-font="nanum"] .modal-body.markdown {
      font-family: "Nanum Myeongjo", "Gowun Batang", "Noto Serif KR", serif;
      letter-spacing: -.01em; word-break: keep-all;
    }
    .modal[data-reader-font="nanum"] .modal-body.markdown p,
    .modal[data-reader-font="nanum"] .modal-body.markdown li { line-height: 1.8; }
    .modal[data-reader-font="song"] .modal-body.markdown {
      font-family: "Song Myung", "Gowun Batang", "Nanum Myeongjo", "Noto Serif KR", serif;
      letter-spacing: -.01em; word-break: keep-all;
    }
    .modal[data-reader-font="song"] .modal-body.markdown p,
    .modal[data-reader-font="song"] .modal-body.markdown li { line-height: 1.8; }
    .modal[data-reader-font="system"] .modal-body.markdown {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }
    .modal[data-reader-font="mono"] .modal-body.markdown {
      font-family: var(--font-mono); letter-spacing: -.01em;
    }
    /* ── 처리 큐(모달 내) ── */
    .mq-add { display: flex; gap: .4rem; margin-bottom: .4rem; }
    .mq-add input { flex: 1; height: 36px; padding: 0 .7rem; font: inherit; font-size: 13px;
                    border: 1px solid var(--border); border-radius: var(--radius-sm);
                    background: var(--surface); color: var(--text); outline: none; }
    .mq-add button { height: 36px; padding: 0 .9rem; font-size: 12.5px; font-weight: 700;
                     border: 1px solid var(--border); border-radius: var(--radius-sm);
                     background: var(--text); color: var(--bg); }
    .mq-add button:disabled { opacity: .35; }
    .mq-add .mq-paste { background: var(--surface2); color: var(--text); padding: 0 .6rem; }
    .mq-cap-chip { height: 30px; padding: 0 .7rem; font-size: 11.5px; font-weight: 700;
                   border: 1px solid var(--border); border-radius: var(--radius-sm);
                   background: var(--surface2); color: var(--muted); margin: -.1rem 0 .4rem; }
    .mq-cap-chip.on { color: var(--highlight); border-color: var(--highlight); background: var(--highlight-soft); }
    .mq-ctl .mq-requeue { width: auto; padding: 0 .5rem; font-size: 12px; }
    .mq-ctl .mq-cap-row { width: auto; padding: 0 .45rem; font-size: 10px; font-weight: 700; color: var(--muted); }
    .mq-ctl .mq-cap-row.on { color: var(--highlight); border-color: var(--highlight); }
    .mq-cap { display: flex; align-items: center; gap: .35rem; font-size: 11.5px;
              color: var(--muted); margin: -.1rem 0 .4rem; }
    .mq-add-pv { min-height: 1em; margin-bottom: .6rem; font-size: 11.5px; }
    .mq-pv-wait { color: var(--muted); }
    .mq-pv-err { color: #dc2626; }
    .mq-pv-ok b { display: block; font-size: 12px; line-height: 1.35; }
    .mq-pv-ok span { color: var(--muted); font-size: 10.5px; }
    .mq-sec { margin: .9rem 0 .4rem; font-size: 11.5px; font-weight: 700; color: var(--muted); }
    .mq-row { display: flex; align-items: center; gap: .5rem; padding: .5rem .55rem;
              border: 1px solid var(--border); border-radius: var(--radius-sm);
              margin-bottom: .35rem; background: var(--surface); }
    .mq-st { flex: 0 0 auto; font-size: 10px; font-weight: 700; padding: .12rem .42rem;
             border-radius: 2px; border: 1px solid var(--border); color: var(--muted); }
    .mq-processing { color: #2563eb; border-color: currentColor; }
    .mq-deferred   { color: #b45309; border-color: currentColor; }
    .mq-done       { color: #16a34a; border-color: currentColor; }
    .mq-failed     { color: #dc2626; border-color: currentColor; }
    .mq-main { flex: 1; min-width: 0; }
    .mq-title { font-size: 12px; line-height: 1.35; overflow: hidden;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .mq-sub { font-size: 10.5px; color: var(--muted); margin-top: .1rem; }
    .mq-ctl { display: inline-flex; gap: .25rem; flex-shrink: 0; }
    .mq-ctl button { width: 28px; height: 28px; border: 1px solid var(--border);
                     border-radius: 2px; background: var(--surface2); color: var(--text);
                     font-size: 13px; line-height: 1; }
    .mq-del { color: #dc2626; }

    /* ── 채널 자동 모니터(모달 내) ── */
    .modal-body.channels { padding: 1rem; display: flex; flex-direction: column; gap: .6rem; }
    .ch-hint { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 0; }
    .ch-queue { font-size: 11.5px; font-family: var(--font-mono); color: var(--muted);
      background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: .45rem .6rem; }
    .model-order-card { display: grid; gap: .6rem; padding: .75rem; min-width: 0;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .model-order-head { display: flex; align-items: center; justify-content: space-between;
      color: var(--text); font-size: 13px; font-weight: 700; }
    .model-order-status { min-height: 1em; color: var(--muted); font-size: 11px; font-weight: 500; }
    .model-order-row { display: flex; align-items: center; gap: .55rem; min-width: 0; }
    .model-order-label { flex: 0 0 34px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .model-order-selects { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .3rem; flex: 1; min-width: 0; }
    .model-order-slot { display: flex; align-items: center; gap: .2rem; min-width: 0; }
    .model-order-rank { flex-shrink: 0; color: var(--muted); font: 10px var(--font-mono); }
    .model-order-select { appearance: none; -webkit-appearance: none;
      min-width: 0; max-width: 100%; width: 100%; height: 31px; padding: 0 1.1rem 0 .3rem;
      color: var(--text); background-color: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; font: 11px var(--font-mono);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23888178' d='M1 1l4 4 4-4'/></svg>");
      background-repeat: no-repeat; background-position: right .35rem center; }
    .model-order-select:disabled { opacity: .55; }
    .model-order-hint { margin: -.1rem 0 0; color: var(--muted); font-size: 10.5px; line-height: 1.4; }
    .ch-empty, .ch-loading { color: var(--muted); font-size: 13.5px; padding: .5rem .2rem; }
    .ch-row { display: flex; align-items: center; gap: .75rem; padding: .7rem .8rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .ch-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .15rem; }
    .ch-name { font-size: 14.5px; font-weight: 650; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 길이제한 면제(min_duration=0) 뱃지 */
    .ch-nolimit { display: inline-block; margin-left: 2px; padding: 0 5px; border-radius: 8px;
      font-size: 12px; font-weight: 700; line-height: 16px; vertical-align: 1px;
      color: #b0413e; background: color-mix(in srgb, #b0413e 12%, transparent); }
    .ch-sub  { font-size: 11.5px; font-family: var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ch-toggle { flex-shrink: 0; width: 46px; height: 26px; padding: 0; position: relative; cursor: pointer;
      background: var(--surface2); border: 1px solid var(--border-strong); border-radius: 999px;
      transition: background .15s, border-color .15s; }
    .ch-knob { position: absolute; top: 50%; left: 2px; transform: translateY(-50%);
      width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: left .15s, background .15s; }
    .ch-toggle.on { background: var(--highlight-soft); border-color: var(--highlight); }
    .ch-toggle.on .ch-knob { left: 22px; background: var(--highlight); }
    .ch-toggle:disabled { opacity: .5; }
    /* 지식증류 대상 — 자동수집 토글과 성격이 달라 칩 형태 */
    .ch-distill { flex-shrink: 0; height: 26px; padding: 0 .55rem; margin-right: .1rem;
      background: transparent; border: 1px solid var(--border); border-radius: 999px;
      color: var(--muted); font: inherit; font-size: 12px; line-height: 1; cursor: pointer; }
    .ch-distill.on { color: var(--highlight); border-color: var(--highlight); background: var(--highlight-soft); }
    .ch-distill:disabled { opacity: .5; }
    .modal-body.markdown h1, .modal-body.markdown h2, .modal-body.markdown h3 {
      margin: 1.1em 0 .4em; line-height: 1.3;
    }
    .modal-body.markdown h1 { font-size: 18px; }
    .modal-body.markdown h2 { font-size: 16.5px; }
    .modal-body.markdown h3 { font-size: 15px; }
    .modal-body.markdown p { margin: .55em 0; }
    .modal-body.markdown ul, .modal-body.markdown ol { padding-left: 1.3em; margin: .55em 0; }
    .modal-body.markdown li { margin: .25em 0; }
    .modal-body.markdown code {
      background: var(--surface2); padding: .1em .35em; border-radius: 2px;
      font-family: var(--font-mono); font-size: .92em;
    }
    .modal-body.markdown pre {
      background: var(--surface2); padding: .8em; border-radius: 2px;
      overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px;
    }
    .modal-body.markdown blockquote {
      border-left: 3px solid var(--border-strong); margin: .55em 0; padding: .1em .8em;
      color: var(--muted);
    }
    .modal-body.markdown table {
      border-collapse: collapse; width: 100%; font-size: 13px; margin: .6em 0;
    }
    .modal-body.markdown th, .modal-body.markdown td {
      border: 1px solid var(--border); padding: .35em .6em; text-align: left;

    .modal-body.markdown th { background: var(--surface2); font-weight: 600; }
    .modal-body.markdown tr:nth-child(even) td { background: oklch(0 0 0 / .025); }
    .modal-body.markdown hr {
      border: none; border-top: 1px solid var(--border); margin: 1em 0;
    }
    .modal-body.transcript {
      white-space: pre-wrap; word-break: break-word;
      font-family: var(--font-mono); font-size: 13px; line-height: 1.6;

  </style>
</head>

    <button class="icon-btn" id="queue-btn" onclick="openQueueM()" aria-label="처리 큐">

<script>window.YS_ASSET_VERSIONS={googleCss:"{{ static_v('fonts/google.css') }}",pretendardCss:"{{ static_v('fonts/pretendard.css') }}",marked:"{{ static_v('vendor/marked.min.js') }}"};</script>
<script src="/static/vendor/marked.min.js?v={{ static_v('vendor/marked.min.js') }}"></script>
<script src="/static/js/common.js?v={{ static_v('js/common.js') }}"></script>
<script>
const SVG = {
  summary:    '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2h7l3 3v9H3V2z"/><path d="M10 2v3h3"/><path d="M5.5 8h5M5.5 10.5h5M5.5 6h2.5"/></svg>',
  transcript: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h11M2.5 6.5h11M2.5 9.5h11M2.5 12.5h7"/></svg>',
  youtube:    '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M14.7 4.4a1.85 1.85 0 0 0-1.3-1.3C12.2 2.8 8 2.8 8 2.8s-4.2 0-5.4.3A1.85 1.85 0 0 0 1.3 4.4 19.4 19.4 0 0 0 1 8a19.4 19.4 0 0 0 .3 3.6 1.85 1.85 0 0 0 1.3 1.3c1.2.3 5.4.3 5.4.3s4.2 0 5.4-.3a1.85 1.85 0 0 0 1.3-1.3A19.4 19.4 0 0 0 15 8a19.4 19.4 0 0 0-.3-3.6zM6.6 10.4V5.6L10.7 8z"/></svg>',
  eye:        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  eye_off:    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>',
  delete:     '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>',
};

const PAGE = 20;
let ALL = [], FILTERED = [], shownCount = 0, HISTORY_REVISION = '';
/* 미읽음만 보기 — 데스크톱과 같은 'histFilter' 키를 공유해 기기 간 상태가 이어진다 */
function _savedFilter() {
  try { return JSON.parse(localStorage.getItem('histFilter') || 'null') || {}; }
  catch { return {}; }
}
function _saveUnread() {
  try {
    localStorage.setItem('histFilter', JSON.stringify({ ..._savedFilter(), unread: _unreadOnly }));
  } catch { /* 스토리지 불가(사파리 프라이빗 등) — 무시 */ }
}
let _unreadOnly = !!_savedFilter().unread;
let _sort = localStorage.getItem('histSort') || 'desc';   // 'desc'=최신순(기본), 'asc'=과거순 (데스크톱과 공유)
let _sortKey = localStorage.getItem('histSortKey') || 'date';  // 'date'=전사 처리일, 'upload'=영상 게시일 (데스크톱과 공유)
/* 정렬 기준값 — 게시일이 없으면 처리일로 대체(순서 뒤엉킴 방지) */
const _sortValue = i => (_sortKey === 'upload' ? (i.upload_date || i.date || '') : (i.date || '')) + ' ' + (i.stem || '');
/* 카드에 찍을 날짜 — 선택한 정렬 기준을 따른다 */
const histDisplayDate = i => (_sortKey === 'upload' ? (i.upload_date || i.date || '') : (i.date || ''));

const $ = id => document.getElementById(id);
// 순수 헬퍼는 공유 모듈(common.js, YS)로 일원화 — 위임만.
const esc = s => YS.escapeHtml(s);
const attrEsc = s => YS.attrEscape(s);
const ytVideoId = url => YS.ytVideoId(url);
const fmtDate = d => YS.fmtDate(d);

function fmtDur(secs) {
  if (!secs || secs <= 0) return '';
  const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = Math.floor(secs%60);
  if (h) return `${h}시간 ${m}분`;
  if (m) return s ? `${m}분 ${s}초` : `${m}분`;
  return `${s}초`;
}
function fmtDurBadge(secs) {
  if (!secs || secs <= 0) return '';
  const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = Math.floor(secs%60);
  const mm = String(m).padStart(2,'0'), ss = String(s).padStart(2,'0');
  return h ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
}

async function loadHistory(force) {
  const btn = $('refresh-btn');
  btn.classList.add('spin');
  $('state').textContent = '로드 중…';
  try {
    const url = (!force && HISTORY_REVISION)
      ? '/history?revision=' + encodeURIComponent(HISTORY_REVISION) : '/history';
    const r = await fetch(url, { cache: force ? 'no-store' : 'default' });
    const d = await r.json();
    if (!d.unchanged) ALL = d.items || [];
    if (d.revision) HISTORY_REVISION = d.revision;
  } catch (e) {
    $('state').textContent = '오류: ' + e.message;
    btn.classList.remove('spin');
    return;
  }
  btn.classList.remove('spin');
  _updateSortBtn();   // 저장된 정렬값 → 토글 버튼 라벨 반영
  $('unread-filter-btn').classList.toggle('active', _unreadOnly);   // 저장된 미읽음 상태 반영
  applyFilter();
}

function applyFilter() {
  const q = $('q').value.trim().toLowerCase();
  FILTERED = ALL.filter(i => {
    if (q && !(i.title||'').toLowerCase().includes(q) && !(i.uploader||'').toLowerCase().includes(q)) return false;
    if (_unreadOnly && i.is_read) return false;
    return true;
  });
  // 정렬: 기준(_sortKey)에 따라 전사 처리일 또는 영상 게시일. desc=최신순, asc=과거순.
  FILTERED.sort((a, b) => {
    const ka = _sortValue(a), kb = _sortValue(b);
    const c = ka < kb ? -1 : ka > kb ? 1 : 0;
    return _sort === 'asc' ? c : -c;
  });
  shownCount = 0;
  $('grid').innerHTML = '';
  appendPage();
  $('count').textContent = `${FILTERED.length}건`;
}

function _updateSortBtn() {
  const b = $('m-sort-btn');
  if (b) b.textContent = _sort === 'asc' ? '과거순 ↑' : '최신순 ↓';
  const k = $('m-sortkey-btn');
  if (k) {
    k.textContent = _sortKey === 'upload' ? '영상게시일' : '전사처리일';
    k.classList.toggle('active', _sortKey === 'upload');
  }
}
function toggleSort() {
  _sort = (_sort === 'asc') ? 'desc' : 'asc';
  localStorage.setItem('histSort', _sort);
  _updateSortBtn();
  applyFilter();
}
/* 정렬 기준 전환 — 카드 날짜 표기도 이 기준을 따른다 */
function toggleSortKey() {
  _sortKey = (_sortKey === 'upload') ? 'date' : 'upload';
  localStorage.setItem('histSortKey', _sortKey);
  _updateSortBtn();
  applyFilter();
}

function toggleUnreadFilter() {
  _unreadOnly = !_unreadOnly;
  $('unread-filter-btn').classList.toggle('active', _unreadOnly);
  _saveUnread();
  applyFilter();
}

/* 썸네일은 전사 때 받아둔 로컬 사본(/thumb)만 쓴다 — 조회 중 외부(i.ytimg)로 나가는
   요청이 없어 VPN 경유에서도 즉시 뜬다. 사본이 없으면 자리표시로 대체한다. */
function _thumbFallback(img) {
  img.onerror = null;
  const ph = document.createElement('div');
  ph.className = 'hist-thumb-placeholder';
  ph.textContent = '썸네일 없음';
  img.replaceWith(ph);
}

function appendPage() {
  const slice = FILTERED.slice(shownCount, shownCount + PAGE);
  if (slice.length === 0) {
    $('state').textContent = FILTERED.length === 0
      ? (ALL.length === 0 ? '이력이 없습니다.' : '검색 결과가 없습니다.')
      : '';
    return;
  }
  const html = slice.map(renderCard).join('');
  $('grid').insertAdjacentHTML('beforeend', html);
  shownCount += slice.length;
  $('state').textContent = shownCount >= FILTERED.length ? '' : '스크롤해서 더 보기…';
}

function renderCard(item) {
  const vid = ytVideoId(item.webpage_url);
  const thumb = vid
    ? `<img class="hist-thumb" src="/thumb/${encodeURIComponent(vid)}" alt="" loading="lazy" data-vid="${attrEsc(vid)}" onerror="_thumbFallback(this)">`
    : `<div class="hist-thumb-placeholder">썸네일 없음</div>`;
  const dur = item.duration
    ? `<span class="hist-thumb-dur">${fmtDurBadge(item.duration)}</span>` : '';
  const uploader = item.uploader && item.uploader !== '—'
    ? (item.channel_url
        ? `<a class="hist-card-uploader" href="${attrEsc(item.channel_url)}" target="_blank" rel="noopener">${esc(item.uploader)}</a>`
        : `<span class="hist-card-uploader">${esc(item.uploader)}</span>`)
    : '';
  const sumBtn = item.has_summary
    ? `<button class="hist-icon-btn hist-icon-btn-summary" data-id="${item.item_id}" data-title="${attrEsc(item.title)}" onclick="event.stopPropagation();openSummary(Number(this.dataset.id),this.dataset.title)" aria-label="요약">${SVG.summary}</button>`
    : `<button class="hist-icon-btn hist-icon-btn-summary" disabled aria-label="요약 없음">${SVG.summary}</button>`;
  const txtBtn = item.has_txt
    ? `<button class="hist-icon-btn" data-id="${item.item_id}" data-title="${attrEsc(item.title)}" onclick="event.stopPropagation();openTranscript(Number(this.dataset.id),this.dataset.title)" aria-label="전사">${SVG.transcript}</button>`
    : `<button class="hist-icon-btn" disabled aria-label="전사 없음">${SVG.transcript}</button>`;
  const ytBtn = item.webpage_url
    ? `<a class="hist-icon-btn hist-icon-btn-youtube" href="${attrEsc(item.webpage_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="YouTube">${SVG.youtube}</a>`
    : `<button class="hist-icon-btn hist-icon-btn-youtube" disabled aria-label="URL 없음">${SVG.youtube}</button>`;
  const readBtn = `<button class="hist-icon-btn hist-icon-btn-read${item.is_read ? ' is-read' : ''}"
    data-id="${item.item_id}" data-read="${item.is_read ? '1' : '0'}"
    onclick="event.stopPropagation();toggleRead(this)"
    aria-label="${item.is_read ? '읽음' : '안읽음'}">${item.is_read ? SVG.eye_off : SVG.eye}</button>`;
  const delBtn = `<button class="hist-icon-btn hist-icon-btn-delete"
    data-id="${item.item_id}" data-title="${attrEsc(item.title)}"
    onclick="event.stopPropagation();deleteCard(this)"
    aria-label="삭제">${SVG.delete}</button>`;

  const unreadDot = !item.is_read ? '<span class="hist-unread-dot"></span>' : '';
  const unreadClass = !item.is_read ? ' hist-card-unread' : '';
  const clickable = item.has_summary
    ? ` hist-card-clickable" data-id="${item.item_id}" data-title="${attrEsc(item.title)}" onclick="openSummary(Number(this.dataset.id),this.dataset.title)`
    : '';
  return `<article class="hist-card${unreadClass}${clickable}">
    <div class="hist-thumb-wrap">${thumb}${dur}</div>
    <div class="hist-card-body">
      <h3 class="hist-card-title">${unreadDot}${esc(item.title)}</h3>
      <div class="hist-card-meta">${uploader}</div>
      <div class="hist-card-footer">
        <span class="hist-card-date">${fmtDate(histDisplayDate(item))}</span>
        <div class="hist-card-actions">${readBtn}${sumBtn}${txtBtn}${ytBtn}${delBtn}</div>
      </div>
    </div>
  </article>`;
}

async function toggleRead(btn) {
  const itemId  = Number(btn.dataset.id);
  const wasRead = btn.dataset.read === '1';
  const newRead = !wasRead;
  try {
    const result = await YS.apiMarkRead(itemId, newRead);
    if (!result) return;
    if (result.revision) HISTORY_REVISION = result.revision;
  } catch { return; }

  // ALL 배열 내 항목 업데이트
  const item = ALL.find(i => i.item_id === itemId);
  if (item) item.is_read = newRead;

  // 버튼 즉시 갱신
  btn.dataset.read = newRead ? '1' : '0';
  btn.innerHTML = newRead ? SVG.eye_off : SVG.eye;
  btn.classList.toggle('is-read', newRead);

  const card = btn.closest('article');
  if (card) {
    card.classList.toggle('hist-card-unread', !newRead);
    const dot = card.querySelector('.hist-unread-dot');
    if (newRead && dot) dot.remove();
    else if (!newRead && !dot) {
      const titleEl = card.querySelector('.hist-card-title');
      if (titleEl) titleEl.insertAdjacentHTML('afterbegin', '<span class="hist-unread-dot"></span>');
    }
  }

  // 미읽음 필터 활성 중이면 읽음 처리된 카드 제거
  if (_unreadOnly && newRead) applyFilter();
}

async function deleteCard(btn) {
  const itemId = Number(btn.dataset.id);
  const title  = btn.dataset.title || '이 항목';
  if (!confirm(`"${title}" 을(를) 삭제하시겠습니까?\n\n전사 파일과 요약 파일이 모두 삭제됩니다.`)) return;

  btn.disabled = true;
  try {
    const result = await YS.apiDeleteItem(itemId);
    if (!result) { btn.disabled = false; return; }
    if (result.revision) HISTORY_REVISION = result.revision;
  } catch { btn.disabled = false; return; }

  // ALL 배열에서 제거 후 다시 필터 적용
  const idx = ALL.findIndex(i => i.item_id === itemId);
  if (idx !== -1) ALL.splice(idx, 1);
  applyFilter();
}

async function loadQueueM() {
  const body = $('modal-body');
  body.innerHTML = '<div class="ch-empty">불러오는 중…</div>';
  try {
    const d = await (await fetch('/queue/items')).json();
    const row = (v, i, movable, extraCtl = '') => {
      const ch = v.channel_name || (v.channel_id === 'manual' ? '수동' : '') || '';
      const fmtEta = t => { const d = new Date(t * 1000);
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
      const bits = [];
      if (v.status === 'deferred' && v.next_retry_at) bits.push(`${v.next_retry_at.slice(5, 16)} 재시도`);
      if (v.eta) bits.push(`~${fmtEta(v.eta)} 시작 예정`);
      if (v.capture === 0) bits.push('캡처 제외');
      if (v.attempt_count > 1) bits.push(`시도 ${v.attempt_count}`);
      const extra = bits.join(' · ');
      const waitingRow = ['pending', 'kf_retry', 'deferred'].includes(v.status);
      const capOn = v.capture !== 0;
      const capBtn = waitingRow && v.status !== 'kf_retry'
        ? `<button class="mq-cap-row ${capOn ? 'on' : ''}" onclick="mqToggleCapture(${v.id}, ${capOn ? 'false' : 'true'})">캡처</button>` : '';
      const ctl = (movable || capBtn || extraCtl) ? `<span class="mq-ctl">${capBtn}${extraCtl}${movable ? `
          <button onclick="mqMove(${v.id},'up')">↑</button>
          <button onclick="mqMove(${v.id},'down')">↓</button>
          <button class="mq-del" onclick="mqCancel(${v.id})">×</button>` : ''}</span>` : '';
      return `<div class="mq-row">
        <span class="mq-st mq-${v.status}">${i ? i + ' · ' : ''}${_Q_ST[v.status] || v.status}</span>
        <div class="mq-main"><div class="mq-title">${attrEsc(v.title || v.yt_id)}</div>
          <div class="mq-sub">${attrEsc([ch, extra].filter(Boolean).join(' · '))}</div></div>${ctl}</div>`;
    };
    const main = d.waiting.filter(v => v.status !== 'kf_retry');
    const kf = d.waiting.filter(v => v.status === 'kf_retry');
    let n = 0, k = 0;
    const keepUrl = $('mq-add-url') ? $('mq-add-url').value : '';
    const keepPv = $('mq-add-pv') ? $('mq-add-pv').innerHTML : '';
    body.innerHTML =
      `<div class="mq-add"><input type="url" id="mq-add-url" placeholder="https://youtu.be/..."
         oninput="mqPreviewDebounced()"><button class="mq-paste" onclick="mqPaste()" title="클립보드에서 붙여넣기">📋</button><button id="mq-add-btn" onclick="mqAdd()" disabled>추가</button></div>
       <button type="button" class="mq-cap-chip on" id="mq-add-capture-btn" role="switch" aria-checked="true"
               onclick="this.classList.toggle('on'); this.setAttribute('aria-checked', this.classList.contains('on'))">영상 캡처 포함</button>
       <div class="mq-add-pv" id="mq-add-pv"></div>`
      + `<p class="ch-hint">유휴면 바로 시작, 이후 30분에 본편 1건 + 캡처 1건.</p>`
      + `<div class="mq-sec">본편 대기 · ${main.length}건</div>`
      + (main.map(v => row(v, ++n, v.status === 'pending')).join('')
         || '<div class="ch-empty">대기 중인 영상이 없습니다.</div>')
      + (kf.length ? `<div class="mq-sec">캡처 재시도 · ${kf.length}건</div>`
         + kf.map(v => row(v, ++k, true)).join('') : '')
      + (d.recent.length ? `<div class="mq-sec">최근 처리</div>`
         + d.recent.map(v => row(v, '', false,
             v.status === 'failed'
               ? `<button class="mq-requeue" onclick="mqRequeue(${v.id})">↻</button>` : '')).join('') : '');
    if (keepUrl) { $('mq-add-url').value = keepUrl; $('mq-add-pv').innerHTML = keepPv;
      if (_mqPv) $('mq-add-btn').disabled = false; }
  } catch (e) {
    body.innerHTML = `<div class="ch-empty">불러오기 실패: ${attrEsc(e.message)}</div>`;
  }
}

const MONITOR_MODELS = ['opus', 'gpt', 'grok', 'qwen'];
const MONITOR_NONE = 'none';
const MONITOR_MODEL_LABELS = { opus: 'Opus 5', gpt: 'GPT-5.6 Sol', grok: 'Grok', qwen: 'Qwen3.8 (로컬)', none: '없음' };
let monitorModelOrders = { summary: [...MONITOR_MODELS], capture: [...MONITOR_MODELS] };

function applyMonitorModelLabels(labels) {
  if (!labels || typeof labels !== 'object') return;
  [...MONITOR_MODELS, MONITOR_NONE].forEach(key => { if (labels[key]) MONITOR_MODEL_LABELS[key] = labels[key]; });
}

function padMonitorOrder(order) {
  const next = (order || []).slice(0, MONITOR_MODELS.length);
  while (next.length < MONITOR_MODELS.length) next.push(MONITOR_NONE);
  return next;
}

function monitorOrderChoices(order, index) {
  if (index > 0 && order.slice(0, index).includes(MONITOR_NONE)) return [MONITOR_NONE];
  if (index === 0) return MONITOR_MODELS.slice();
  return MONITOR_MODELS.concat(MONITOR_NONE);
}

function applyMonitorOrderChange(order, index, selected) {
  const next = padMonitorOrder(order);
  if (index === 0 && selected === MONITOR_NONE) return next;
  if (selected === MONITOR_NONE) {
    for (let i = index; i < next.length; i++) next[i] = MONITOR_NONE;
    return next;
  }
  const other = next.indexOf(selected);
  if (other === index) return next;
  if (other >= 0) {
    const displaced = next[index];
    next[index] = next[other];
    next[other] = displaced;
  } else {
    next[index] = selected;
  }
  const noneAt = next.indexOf(MONITOR_NONE);
  if (noneAt >= 0) {
    for (let i = noneAt; i < next.length; i++) next[i] = MONITOR_NONE;
  }
  return next;
}

function monitorModelControlsHtml() {
  return `<div class="model-order-card">
    <div class="model-order-head"><span>LLM 처리 순서</span><span class="model-order-status" id="model-order-status"></span></div>
    <div class="model-order-row"><span class="model-order-label">요약</span><div class="model-order-selects" id="summary-model-order"></div></div>
    <div class="model-order-row"><span class="model-order-label">캡처</span><div class="model-order-selects" id="capture-model-order"></div></div>
    <p class="model-order-hint">실패 시 오른쪽으로 넘어가고, 없음에서 멈춥니다.</p>
  </div>`;
}

function renderMonitorModelOrders() {
  for (const kind of ['summary', 'capture']) {
    const el = $(kind + '-model-order');
    if (!el) continue;
    const order = padMonitorOrder(monitorModelOrders[kind] || MONITOR_MODELS);
    el.innerHTML = order.map((selected, index) => {
      const options = monitorOrderChoices(order, index).map(model =>
        `<option value="${model}" ${model === selected ? 'selected' : ''}>${MONITOR_MODEL_LABELS[model] || model}</option>`
      ).join('');
      return `<label class="model-order-slot"><span class="model-order-rank">${index + 1}</span>`
        + `<select class="model-order-select" aria-label="${kind === 'summary' ? '요약' : '캡처'} ${index + 1}순위" `
        + `onchange="changeMonitorModelOrder('${kind}', ${index}, this.value)">${options}</select></label>`;
    }).join('');
  }
}

async function changeMonitorModelOrder(kind, index, selected) {
  const original = [...monitorModelOrders[kind]];
  const next = applyMonitorOrderChange(original, index, selected);
  monitorModelOrders[kind] = next;
  renderMonitorModelOrders();
  const selects = document.querySelectorAll('.model-order-select');
  const status = $('model-order-status');
  selects.forEach(el => { el.disabled = true; });
  status.textContent = '저장 중…';
  try {
    const d = await (await fetch('/channels/model-orders', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ [kind]: next }),
    })).json();
    if (d.error) throw new Error(d.error);
    monitorModelOrders = d.model_orders;
    applyMonitorModelLabels(d.model_labels);
    status.textContent = '저장됨';
  } catch (e) {
    monitorModelOrders[kind] = original;
    status.textContent = '저장 실패';
    alert('모델 순서 저장 실패: ' + e.message);
  } finally {
    renderMonitorModelOrders();
    window.setTimeout(() => { if (status.textContent === '저장됨') status.textContent = ''; }, 1400);
  }
}

async function loadChannels() {
  const body = $('modal-body');
  body.innerHTML = '<div class="ch-loading">불러오는 중…</div>';
  try {
    const d = await (await fetch('/channels', { cache: 'no-store' })).json();
    if (d.error) throw new Error(d.error);
    monitorModelOrders = d.model_orders || monitorModelOrders;
    applyMonitorModelLabels(d.model_labels);
    const q = d.queue || {}, parts = [];
    if (q.pending)    parts.push(`대기 ${q.pending}`);
    if (q.processing) parts.push(`처리중 ${q.processing}`);
    if (q.kf_retry)   parts.push(`캡처재시도 ${q.kf_retry}`);
    if (q.done)       parts.push(`완료 ${q.done}`);
    if (q.failed)     parts.push(`실패 ${q.failed}`);
    const qline = parts.length ? '큐: ' + parts.join(' · ') : '큐 비어있음';
    const chans = d.channels || [];
    const rows = chans.length ? chans.map(c => {
      const on = !!c.enabled;
      const sub = (c.handle ? '@' + c.handle : c.channel_id) +
                  (c.last_checked ? ` · 확인 ${esc(c.last_checked.slice(5, 16))}` : '');
      // min_duration 뱃지: 0=면제(∞), 그 외 값=커스텀 최소길이(N분+). NULL=전역 기본(3분, 표시 없음)
      const noLimit = c.min_duration === 0
        ? ' <span class="ch-nolimit" title="길이제한 면제 — 짧은 영상도 수집">∞</span>'
        : (c.min_duration != null
          ? ` <span class="ch-nolimit" title="최소 길이 ${Math.round(c.min_duration / 60)}분 — 그 미만은 수집 제외">${Math.round(c.min_duration / 60)}분+</span>` : '');
      const dis = c.distill == null ? true : !!c.distill;   // 기본은 증류 대상
      const cap = c.capture == null ? true : !!c.capture;   // 기본은 캡처 포함
      return `<div class="ch-row">
        <div class="ch-meta"><span class="ch-name">${esc(c.title || c.handle || c.channel_id)}${noLimit}</span><span class="ch-sub">${esc(sub)}</span></div>
        <button class="ch-distill ${cap ? 'on' : ''}" role="switch" aria-checked="${cap}"
                aria-label="영상 캡처 포함" onclick="toggleChannelCapture(${c.id}, ${cap ? 'false' : 'true'}, this)">캡처</button>
        <button class="ch-distill ${dis ? 'on' : ''}" role="switch" aria-checked="${dis}"
                aria-label="지식증류 대상" onclick="toggleChannelDistill(${c.id}, ${dis ? 'false' : 'true'}, this)">증류</button>
        <button class="ch-toggle ${on ? 'on' : ''}" role="switch" aria-checked="${on}"
                aria-label="자동 수집" onclick="toggleChannel(${c.id}, ${on ? 'false' : 'true'}, this)"><span class="ch-knob"></span></button>
      </div>`;
    }).join('') : '<div class="ch-empty">등록된 채널이 없습니다.</div>';
    body.innerHTML = `<p class="ch-hint">등록 채널에 새 영상이 올라오면 자동으로 전사·요약·캡처합니다(20분 주기).</p>`
      + monitorModelControlsHtml() + `<div class="ch-queue">${esc(qline)}</div>${rows}`;
    renderMonitorModelOrders();
  } catch (e) {
    body.innerHTML = `<div class="ch-empty">오류: ${esc(e.message)}</div>`;
  }
}
/* 영상 캡처 토글 — 끄면 그 채널 신규 영상은 요약만 하고 키프레임을 만들지 않는다 */
async function toggleChannelCapture(id, enable, btn) {

    const d = await (await fetch('/channels/' + id, {

    btn.setAttribute('aria-checked', String(d.capture));
    btn.setAttribute('onclick', `toggleChannelCapture(${id}, ${d.capture ? 'false' : 'true'}, this)`);
  } catch (e) {
    alert('캡처 설정 실패: ' + e.message);
  } finally { btn.disabled = false; }
}

const FS_MIN = 11, FS_MAX = 22;
function _applyReaderFs() { $('modal-body').style.setProperty('--reader-fs', _readerFs + 'px'); }
function adjustFs(delta) {
  _readerFs = Math.max(FS_MIN, Math.min(FS_MAX, _readerFs + delta));
  localStorage.setItem('sumFontSize', _readerFs);
  _applyReaderFs();
}

// 데스크톱과 같은 본문 글꼴 설정을 공유하고 로컬에 기억한다.
const _READER_FONTS = {
  sans: 'Noto Sans KR', pretendard: 'Pretendard', chosun: '조선일보명조', serif: 'Noto Serif KR',
  gowun: '고운바탕', nanum: '나눔명조', song: '송명', system: '시스템', mono: '고정폭',
};
let _readerFont = localStorage.getItem('sumReaderFont') || 'sans';
if (_readerFont === 'news') _readerFont = 'gowun';
if (!_READER_FONTS[_readerFont]) _readerFont = 'sans';
/* Pretendard 가변 폰트는 2MB라 항상 받지 않고, 고른 사람에게만 그때 로드한다.
   나머지 글꼴은 요약 렌더 직후 지연 로딩되는 google.css에 들어 있다. */
function _ensurePretendard() {
  if (document.getElementById('ys-pretendard-css')) return;
  const v = (window.YS_ASSET_VERSIONS || {}).pretendardCss;
  const l = document.createElement('link');
  l.id = 'ys-pretendard-css';
  l.rel = 'stylesheet';
  l.href = '/static/fonts/pretendard.css' + (v ? '?v=' + encodeURIComponent(v) : '');
  document.head.appendChild(l);
}
function _applyReaderFont() {
  if (_readerFont === 'pretendard') _ensurePretendard();
  $('modal').dataset.readerFont = _readerFont;
  if ($('font-select').value !== _readerFont) $('font-select').value = _readerFont;
}
function setReaderFont(key) {
  if (!_READER_FONTS[key]) return;
  _readerFont = key;
  localStorage.setItem('sumReaderFont', key);
  _applyReaderFont();
}

let _summaryMd = '';   // 현재 열린 요약 원문 — 텔레그램용 복사에 사용

async function openSummary(itemId, title) {
  openModal(title);
  $('fs-ctrl').hidden = false;   // 요약에서만 글자크기 조절 노출
  $('font-ctrl').hidden = false;
  _applyReaderFs();
  _applyReaderFont();
  _summaryMd = '';
  _summaryItemId = itemId;
  $('tg-btn').hidden = true;
  $('blg-btn').hidden = true;
  $('distill-ctrl').hidden = true;
  _setDistillUI(null);
  try {
    const [d] = await Promise.all([
      YS.apiSummaryContent(itemId),
      YS.ensureReaderAssets(),
    ]);
    if (d.error) {
      $('modal-body').textContent = '오류: ' + d.error;
    } else {
      _summaryMd = d.content || '';
      $('modal-body').className = 'modal-body markdown';
      $('modal-body').innerHTML = YS.renderMarkdown(_summaryMd);
      YS.applyTitleTranslation($('modal-body'), d.title_ko);  // 제목은 번역본, 원문은 아래 병기
      $('tg-btn').hidden = !_summaryMd;   // 요약을 실제로 불러온 뒤에만 노출
      $('blg-btn').hidden = !_summaryMd;
      $('distill-ctrl').hidden = !_summaryMd;
      _setDistillUI(d.distill);
    }
  } catch (e) {
    $('modal-body').textContent = '오류: ' + e.message;
  }
}

/* 비보안 컨텍스트(원격 http 접속)에는 navigator.clipboard가 없다 —
   copy 이벤트를 가로채 clipboardData에 직접 넣는 경로로 폴백한다(데스크톱과 동일 방식). */
function _copyHtmlLegacy(html, text) {
  let ok = false;
  const onCopy = (e) => {
    e.clipboardData.setData('text/html', html);
    e.clipboardData.setData('text/plain', text);
    e.preventDefault();
    ok = true;
  };
  document.addEventListener('copy', onCopy, true);
  const holder = document.createElement('div');
  holder.contentEditable = 'true';
  holder.textContent = ' ';
  holder.setAttribute('style', 'position:fixed;left:-99999px;top:0;opacity:0;');
  document.body.appendChild(holder);
  const sel = window.getSelection();
  const saved = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
  const range = document.createRange();
  range.selectNodeContents(holder);
  sel.removeAllRanges(); sel.addRange(range);
  try { document.execCommand('copy'); } catch { /* ok=false 유지 */ }
  document.removeEventListener('copy', onCopy, true);
  sel.removeAllRanges(); if (saved) sel.addRange(saved);
  holder.remove();
  return ok;
}

let _summaryItemId = 0;  // 현재 열린 요약의 DB ID — 경로를 브라우저에 노출하지 않는다

let _distill = null;   // 현재 영상의 증류 상태 {override, channel, effective}

/* 증류 토글 표시 — 채널 따름일 때는 그 채널의 실제 값(포함/제외)을 옆에 함께 보여준다 */
function _setDistillUI(d) {
  const box = $('distill-ctrl');
  if (!box) return;
  _distill = d || null;
  const ov = d ? d.override : null;
  const set = ov !== null && ov !== undefined;
  box.classList.toggle('set', set);
  if (!d) { box.textContent = '—'; box.title = ''; return; }
  const chan = d.channel ? '포함' : '제외';
  // 자동수집 채널이 아니면 따를 채널 설정 자체가 없다 → '채널'이 아니라 '기본'으로 설명한다.
  const reg  = d.registered !== false;
  const src  = reg ? '채널' : '기본';
  const srcDesc = reg ? `채널 설정을 따름 → 현재 ${chan}`
                      : `자동수집 채널이 아니라 기본값 적용 → ${chan}`;
  if (!set) {
    // 좁은 헤더라 값만 남기고 '따름'은 ↪ 기호로 구분한다(전체 설명은 툴팁)
    box.textContent = `↪${chan}`;
    box.title = `${srcDesc}. 탭하면 이 영상만 '포함'으로`;
  } else if (ov) {
    box.textContent = '✓포함';
    box.title = `이 영상만 포함(${src} 설정은 ${chan}). 탭하면 '제외'로`;
  } else {
    box.textContent = '✕제외';
    box.title = `이 영상만 제외(${src} 설정은 ${chan}). 탭하면 '${src} 따름'으로`;
  }
}

/* 탭할 때마다 채널 따름 → 포함 → 제외 → 채널 따름 */
function cycleItemDistill() {
  const ov = _distill ? _distill.override : null;
  setItemDistill((ov === null || ov === undefined) ? true : (ov ? false : null));
}

/* 영상 단위 증류 설정 — null=미설정(채널 따름), true=포함, false=제외 */
async function setItemDistill(value) {
  if (!_summaryItemId) return;
  try {
    const r = await fetch('/history/distill', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item_id: _summaryItemId, distill: value }),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    _setDistillUI(d);
  } catch (e) {
    alert('증류 설정 실패: ' + e.message);
  }
}

/* 내보내기 복사 공통 — build()가 {html,text}(+텔레그램은 parts/overLimit)를 준다.
   원격 http(비보안)에는 navigator.clipboard가 없어 레거시 경로로 폴백한다. */
async function _copyExport(btn, icon, build) {
  if (!_summaryMd) return;
  const lbl = btn.querySelector('.tg-label');
  const { html, text, parts, overLimit } = build(_summaryMd);
  let ok = false;
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html':  new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([text], { type: 'text/plain' }),
      })]);
      ok = true;
    }
  } catch (e) { /* 레거시로 폴백 */ }
  if (!ok) ok = _copyHtmlLegacy(html, text);
  if (!ok)              { lbl.textContent = '실패';            btn.className = 'tg-btn err'; }
  else if (overLimit)   { lbl.textContent = `복사됨 ${parts}개`; btn.className = 'tg-btn warn'; }
  else                  { lbl.textContent = '복사됨';           btn.className = 'tg-btn done'; }
  setTimeout(() => { lbl.textContent = icon; btn.className = 'tg-btn'; }, overLimit ? 3000 : 1600);
}

const copyForTelegram = (btn) => _copyExport(btn, '✈️', YS.mdToTelegram);
const copyForBlogger  = (btn) => _copyExport(btn, '📋', YS.mdToBloggerHtml);

async function openTranscript(itemId, title) {
  openModal(title);
  $('fs-ctrl').hidden = true;   // 전사 보기엔 글자크기 조절 숨김(요약 전용)
  $('font-ctrl').hidden = true;
  $('tg-btn').hidden = true;    // 내보내기 복사·증류 설정은 요약 전용
  $('blg-btn').hidden = true;
  $('distill-ctrl').hidden = true;
  _summaryMd = '';
  try {
    const r = await fetch('/history/text', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ item_id: itemId })
    });
    const d = await r.json();
    if (d.error) {
      $('modal-body').textContent = '오류: ' + d.error;
    } else {
      $('modal-body').className = 'modal-body transcript';
      $('modal-body').textContent = d.text || '';
    }
  } catch (e) {
    $('modal-body').textContent = '오류: ' + e.message;
  }
}

/* 아주 가벼운 markdown 렌더러 (요약 표시용) */
// 마크다운 렌더링은 공유 모듈(YS.renderMarkdown, marked.js 기반)로 일원화.
// 수제 파서 제거 → index/summary와 동일 엔진으로 표·이스케이프 처리 일치.
function mdToHtml(src) { return YS.renderMarkdown(src); }

/* ── 검색 디바운스 ── */
let searchTimer;
$('q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilter, 180);
});

/* ── 무한 스크롤 ── */
const io = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && shownCount < FILTERED.length) appendPage();
}, { rootMargin: '400px' });
io.observe($('sentinel'));

/* ── Pull-to-refresh ── */
let ptrY0 = 0, ptrDy = 0, ptrActive = false;
window.addEventListener('touchstart', e => {
  if (window.scrollY > 0) return;
  ptrY0 = e.touches[0].clientY; ptrDy = 0; ptrActive = true;
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (!ptrActive) return;
  ptrDy = e.touches[0].clientY - ptrY0;
  if (ptrDy > 8) {
    $('ptr').classList.add('visible');
    $('ptr-text').textContent = ptrDy > 70 ? '놓으면 새로고침' : '아래로 당겨 새로고침';
  }
}, { passive: true });
window.addEventListener('touchend', () => {
  if (!ptrActive) return;
  if (ptrDy > 70) loadHistory(true);
  $('ptr').classList.remove('visible');
  ptrActive = false; ptrDy = 0;
}, { passive: true });

/* ── ESC로 모달 닫기 ── */
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── 진입 시 자동 fetch ── */
loadHistory();

/* ── 페이지 가시화 시 자동 새로고침 (다른 탭에서 돌아올 때) ── */
let lastRefresh = Date.now();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - lastRefresh > 60_000) {
    lastRefresh = Date.now();
    loadHistory(false);
  }
});
</script>
