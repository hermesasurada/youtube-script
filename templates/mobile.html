<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9" id="theme-color-meta">
  <!-- 색상 모드(시스템·라이트·다크) — 공용 hermes-theme(2026-10-24 사용자 지시). head에서 바로 불러 깜빡임 없이 -->
  <script src="/static/js/hermes-theme.js?v={{ static_v('js/hermes-theme.js') }}"></script>
  <link rel="stylesheet" href="/static/css/hermes-theme.css?v={{ static_v('css/hermes-theme.css') }}">
  <title>유튜브 전사내역</title>
  <!-- 작은 로컬 marked는 선로드하고, 본문용 웹폰트·KaTeX는 요약 뒤에 로딩한다. -->
  <link rel="stylesheet" href="/reader-fonts/core.css?v={{ reader_font_v('core.css') }}">
  <link rel="stylesheet" href="/static/css/model-selector.css?v={{ static_v('css/model-selector.css') }}">
  <link rel="stylesheet" href="/static/css/mobile.css?v={{ static_v('css/mobile.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>유튜브 전사내역</h1>
    <a class="icon-btn" id="collections-btn" href="/collections" aria-label="영상 모음" title="영상 모음"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M10 8.5v4l3.5-2z"/><path d="M6 20h12"/></svg></a>
    <button class="icon-btn" id="queue-btn" onclick="openQueueM()" aria-label="처리 큐">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </button>
    <button class="icon-btn" id="channels-btn" onclick="openChannels()" aria-label="설정 — 모델 · 채널 · 각주 제외" title="설정">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <span id="theme-slot" style="display:contents"></span>
  </header>

  <div class="search">
    <input type="search" id="q" placeholder="검색" autocomplete="off" enterkeyhint="search">
    <button class="icon-toggle" id="uploader-filter-btn" type="button" onclick="openUploaderM()"
            aria-pressed="false" aria-label="채널 선택" title="채널 선택">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
    </button>
    <button class="sort-toggle" id="m-sortkey-btn" type="button" onclick="toggleSortKey()" aria-label="정렬 기준 전환(전사처리일/영상게시일)">전사처리일</button>
    <button class="icon-toggle" id="m-sort-btn" type="button" onclick="toggleSort()"
            aria-pressed="false" aria-label="최신순 정렬 (누르면 과거순)" title="최신순"></button>
    <button class="icon-toggle" id="distill-filter-btn" type="button" onclick="toggleDistillFilter()"
            aria-pressed="false" aria-label="증류 대상이면서 게시일 7일 이내인 영상만 보기" title="증류만(게시일 7일 이내)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.6 18.6A1.6 1.6 0 0 0 6 21h12a1.6 1.6 0 0 0 1.4-2.4L14 9V3"/><path d="M7.5 15h9"/></svg>
    </button>
    <button class="icon-toggle" id="bookmark-filter-btn" type="button" onclick="toggleBookmarkFilter()"
            aria-pressed="false" aria-label="북마크한 영상만 보기" title="북마크만">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button class="icon-toggle" id="unread-filter-btn" type="button" onclick="toggleUnreadFilter()"
            aria-pressed="false" aria-label="안 읽은 영상만 보기" title="미읽음만">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <!-- 건수 · 켜진 필터(눌러서 해제) · 보기 전환(카드/목록) — 2026-11-20 -->
  <div class="list-bar">
    <span class="count" id="count">—</span>
    <span class="filter-chips" id="filter-chips"></span>
    <div class="view-toggle" role="group" aria-label="보기 방식">
      <button type="button" id="view-card-btn" onclick="setListView('card')" aria-pressed="true" aria-label="카드로 보기" title="카드로 보기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/></svg></button>
      <button type="button" id="view-list-btn" onclick="setListView('list')" aria-pressed="false" aria-label="목록으로 보기" title="목록으로 보기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="6" height="4" rx="1"/><path d="M12 6h9"/><rect x="3" y="10" width="6" height="4" rx="1"/><path d="M12 12h9"/><rect x="3" y="16" width="6" height="4" rx="1"/><path d="M12 18h9"/></svg></button>
    </div>
  </div>

  <div class="ptr" id="ptr"><span id="ptr-text">아래로 당겨 새로고침</span></div>

  <main>
    <div class="hist-grid" id="grid"></div>
    <div class="state" id="state">로드 중…</div>
    <div class="sentinel" id="sentinel"></div>
  </main>

  <div class="modal-backdrop" id="modal-bd" onclick="closeModal()"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <header class="modal-hdr">
      <button class="icon-btn" onclick="closeModal()" aria-label="닫기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <h2 class="modal-title" id="modal-title"></h2>
      <a class="modal-youtube-link" id="modal-youtube-link" href="#" target="_blank"
         rel="noopener noreferrer" aria-label="YouTube에서 보기" hidden>
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M14.7 4.4a1.85 1.85 0 0 0-1.3-1.3C12.2 2.8 8 2.8 8 2.8s-4.2 0-5.4.3A1.85 1.85 0 0 0 1.3 4.4 19.4 19.4 0 0 0 1 8a19.4 19.4 0 0 0 .3 3.6 1.85 1.85 0 0 0 1.3 1.3c1.2.3 5.4.3 5.4.3s4.2 0 5.4-.3a1.85 1.85 0 0 0 1.3-1.3A19.4 19.4 0 0 0 15 8a19.4 19.4 0 0 0-.3-3.6zM6.6 10.4V5.6L10.7 8z"/></svg>
        <span class="mobile-youtube-label">YouTube</span>
      </a>
      <label class="font-ctrl" id="font-ctrl" title="본문 글꼴" hidden>
        <select id="font-select" onchange="setReaderFont(this.value)" aria-label="본문 글꼴"></select>
      </label>
      <div class="fs-ctrl" id="fs-ctrl" hidden>
        <button class="fs-btn" onclick="adjustFs(-1)" aria-label="글자 작게">−</button>
        <button class="fs-btn" onclick="adjustFs(1)" aria-label="글자 크게">+</button>
      </div>
    </header>
    <div class="read-progress" id="read-progress"></div>
    <div class="modal-body" id="modal-body"></div>
    <footer class="summary-actions" id="summary-actions" hidden>
      <button class="summary-action-btn" id="summary-read-btn" onclick="toggleSummaryReadM(this)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="read-label">읽음 처리</span>
      </button>
      <button class="distill-ctrl" id="distill-ctrl" onclick="cycleItemDistill()" aria-label="증류 대상 전환">증류 —</button>
      <button class="summary-action-btn" id="export-btn" onclick="exportSummaryHtmlM(this)" aria-label="HTML 파일로 보내기"
              title="이 요약을 HTML 파일 하나로 보내기(캡처 이미지 포함)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
        <span class="action-label">HTML 파일</span>
      </button>
      <button class="summary-action-btn primary" id="pub-btn" onclick="publishToBlog(this)"
              title="요약을 내 블로그스팟에 바로 발행 (즉시 공개)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
        <span class="action-label">블로그 발행</span>
      </button>
    </footer>
  </div>

<!-- 본문 글꼴 목록은 공용 fonts.js가 정본(2026-11-01) -->
<script src="/reader-fonts/fonts.js?v={{ reader_font_v('fonts.js') }}"></script>
<script>
window.YS_META_COMPACT = true;
window.YS_ASSET_VERSIONS={googleCss:"{{ reader_font_v('google.css') }}",marked:"{{ static_v('vendor/marked.min.js') }}"};</script>
<script src="/static/vendor/marked.min.js?v={{ static_v('vendor/marked.min.js') }}"></script>
<script src="/static/js/common.js?v={{ static_v('js/common.js') }}"></script>
<script>
  // 색상 모드 버튼(헤더) + 주소창 색(theme-color)을 실제 모드에 맞춘다
  HermesTheme.mount(document.getElementById('theme-slot'), { className: 'icon-btn' });
  (function () {
    const sync = () => { const m = document.getElementById('theme-color-meta'); if (m) m.content = document.documentElement.dataset.theme === 'dark' ? '#111214' : '#f6f7f9'; };
    window.addEventListener('hermes-theme', sync); sync();
  })();
</script>
<script src="/static/js/model-selector.js?v={{ static_v('js/model-selector.js') }}"></script>
<script src="/static/js/channel-list.js?v={{ static_v('js/channel-list.js') }}"></script>
<script src="/static/js/mobile.js?v={{ static_v('js/mobile.js') }}"></script>
</body>
</html>
