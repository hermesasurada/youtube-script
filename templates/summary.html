<!DOCTYPE html>
<html lang="ko">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');</script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요약 뷰어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #131210;
  --surface:   #1a1916;
  --surface2:  #221f1a;
  --border:    #2a2620;
  --border-strong: #3a3530;
  --text:      #ece7dc;
  --muted:     #888178;
  --subtle:    #5a5650;
  --accent:    #ece7dc;
  --accent-fg: #131210;
  --highlight: oklch(0.72 0.13 28);
  --highlight-soft: oklch(0.72 0.13 28 / .14);
  --success:   oklch(0.74 0.13 155);
  --error:     oklch(0.66 0.18 22);

  --sidebar-w: 300px;
  --radius:    6px;
  --radius-lg: 10px;
  --radius-sm: 4px;

  --scrollbar-thumb: #2e2a24;
  --ghost-hover: #221f1a;
  --row-sel:     #221f1a;
  --row-sel-hov: #2a2620;

  --font-sans: 'Pretendard Variable', 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, ui-monospace, monospace;
}

[data-theme="light"] {
  --bg:        #f6f3ec;
  --surface:   #ffffff;
  --surface2:  #efebe1;
  --border:    #e3ddd0;
  --border-strong: #c8c0b0;
  --text:      #1a1815;
  --muted:     #807a6f;
  --subtle:    #b3ad9f;
  --accent:    #1a1815;
  --accent-fg: #f6f3ec;
  --highlight: oklch(0.5 0.13 28);
  --highlight-soft: oklch(0.5 0.13 28 / .1);

  --scrollbar-thumb: #cdc6b6;
  --ghost-hover: #ebe6d8;
  --row-sel:     #efebe1;
  --row-sel-hov: #e8e2d3;
}

html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  letter-spacing: -0.005em;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

/* ── Header ── */
header {
  flex-shrink: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0 1.25rem;
  height: 52px;
  display: flex;
  align-items: center;
  gap: .75rem;
}
header h1 {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -.012em;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: .5rem;
  white-space: nowrap;
}
header h1::before {
  content: '';
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 2px;
  background: var(--highlight);
  margin-right: .1rem;
}
.back-link {
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
  padding: .25rem .55rem;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: .3rem;
  transition: color .15s, background .15s, border-color .15s;
  white-space: nowrap;
}
.back-link:hover { color: var(--text); background: var(--surface2); border-color: var(--border-strong); }
.header-sep {
  width: 1px; height: 18px;
  background: var(--border);
  flex-shrink: 0;
}
.header-count {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--muted);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .1rem .45rem;
  white-space: nowrap;
}
.theme-btn {
  margin-left: auto;
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--muted);
  width: 30px; height: 30px;
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color .15s, border-color .15s, background .15s;
  flex-shrink: 0;
}
.theme-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface2); }

/* ── Workspace ── */
.workspace {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

.search-wrap {
  padding: .625rem .75rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.search-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .375rem .65rem;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus {
  border-color: var(--border-strong);
  box-shadow: 0 0 0 2px var(--highlight-soft);
}

.file-tree {
  flex: 1;
  overflow-y: auto;
  padding: .375rem 0 1rem;
}

.no-files {
  padding: 2rem 1rem;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

/* ── Date Group ── */
.date-group { margin-bottom: .125rem; }

.date-header {
  display: flex;
  align-items: center;
  gap: .4rem;
  padding: .45rem .75rem;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .04em;
  text-transform: uppercase;
  cursor: pointer;
  user-select: none;
  transition: color .12s;
}
.date-header:hover { color: var(--text); }

.chevron {
  font-size: 10px;
  display: inline-block;
  transition: transform .15s;
  color: var(--subtle);
  width: 10px;
  text-align: center;
}
.chevron.collapsed { transform: rotate(-90deg); }

.date-label { flex: 1; min-width: 0; }

.date-count {
  font-family: var(--font-mono);
  font-size: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: .05rem .4rem;
  color: var(--subtle);
  flex-shrink: 0;
}

/* ── File Item ── */
.file-list { padding: 0 .375rem; }

.file-item {
  padding: .45rem .625rem;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--text);
  border-left: 2px solid transparent;
  transition: background .1s;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 1px;
}
.file-item:hover { background: var(--ghost-hover); }
.file-item.active {
  background: var(--row-sel);
  border-left-color: var(--highlight);
  color: var(--text);
}
.file-item.active:hover { background: var(--row-sel-hov); }

/* ── Content ── */
.content {
  flex: 1;
  overflow-y: auto;
  background: var(--bg);
  position: relative;
}

.empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .75rem;
  color: var(--muted);
}
.empty-state .empty-icon {
  font-size: 2rem;
  opacity: .35;
}
.empty-state p { font-size: 13px; }

.md-wrap {
  padding: 2.5rem 3.5rem;
  min-height: 100%;
}

/* ── Markdown Body ── */
.md-body {
  max-width: 760px;
  margin: 0 auto;
}

.md-loading {
  color: var(--muted);
  font-size: 13px;
  padding: 2rem 0;
}

.md-error {
  color: var(--error);
  font-size: 13px;
  padding: 2rem 0;
}

.md-body h1 {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -.025em;
  line-height: 1.3;
  color: var(--text);
  margin-bottom: 1.5rem;
}

.md-body h2 {
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--text);
  margin-top: 2.5rem;
  margin-bottom: .75rem;
  padding-bottom: .4rem;
  border-bottom: 1px solid var(--border);
}

.md-body h3 {
  font-size: .9375rem;
  font-weight: 600;
  letter-spacing: -.005em;
  color: var(--highlight);
  margin-top: 1.5rem;
  margin-bottom: .4rem;
}

.md-body p {
  margin-bottom: .75rem;
  line-height: 1.75;
  font-size: .9375rem;
  color: var(--text);
}

.md-body hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2rem 0;
}

.md-body ul, .md-body ol {
  padding-left: 1.5rem;
  margin-bottom: .75rem;
}
.md-body li {
  line-height: 1.7;
  font-size: .9375rem;
  margin-bottom: .2rem;
}

.md-body strong { font-weight: 600; }
.md-body em { font-style: italic; }

.md-body code {
  font-family: var(--font-mono);
  font-size: .825em;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .1em .35em;
}

.md-body pre {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  overflow-x: auto;
  margin-bottom: 1rem;
}
.md-body pre code {
  background: none;
  border: none;
  padding: 0;
  font-size: .85rem;
}

/* ── Table ── */
.md-body table {
  width: 100%;
  border-collapse: collapse;
  margin: .75rem 0 1.5rem;
  font-size: .875rem;
}
.md-body th {
  background: var(--surface2);
  font-weight: 600;
  padding: .45rem .75rem;
  text-align: left;
  border: 1px solid var(--border);
  color: var(--text);
  font-size: .8125rem;
  letter-spacing: .01em;
}
.md-body td {
  padding: .4rem .75rem;
  border: 1px solid var(--border);
  line-height: 1.55;
  vertical-align: top;
}
.md-body tr:nth-child(even) td { background: var(--surface2); }
.md-body td a, .md-body p a {
  color: var(--highlight);
  text-decoration: none;
  word-break: break-all;
}
.md-body td a:hover, .md-body p a:hover { text-decoration: underline; }

/* ── Blockquote ── */
.md-body blockquote {
  border-left: 3px solid var(--highlight);
  padding: .5rem 1rem;
  margin: 1rem 0;
  color: var(--muted);
  background: var(--surface2);
  border-radius: 0 var(--radius) var(--radius) 0;
}
</style>
</head>
<body>

<header>
  <h1>요약 뷰어</h1>
  <div class="header-sep"></div>
  <a href="/" class="back-link">← 전사</a>
  <span class="header-count" id="header-count">— 개</span>
  <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="라이트/다크 전환">◐</button>
</header>

<div class="workspace">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="search-wrap">
      <input class="search-input" type="search" id="search"
             placeholder="제목 검색..." autocomplete="off" spellcheck="false">
    </div>
    <div class="file-tree" id="file-tree">
      <div class="no-files">불러오는 중…</div>
    </div>
  </aside>

  <!-- ── Content ── -->
  <div class="content" id="content">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">📄</div>
      <p>왼쪽 목록에서 파일을 선택하세요</p>
    </div>
    <div class="md-wrap" id="md-wrap" style="display:none">
      <div class="md-body" id="md-body"></div>
    </div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

// ── Theme ──────────────────────────────────────────────
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  $('theme-btn').textContent = next === 'light' ? '☀' : '◐';
}
(function () {
  const t = localStorage.getItem('theme') || 'light';
  $('theme-btn').textContent = t === 'light' ? '☀' : '◐';
})();

// ── marked.js 설정 ─────────────────────────────────────
const renderer = new marked.Renderer();
renderer.link = function(href, title, text) {
  const h = (typeof href === 'object') ? href.href : href;
  const t = (typeof href === 'object') ? href.text : text;
  return `<a href="${h}" target="_blank" rel="noopener noreferrer">${t}</a>`;
};
marked.use({ renderer, breaks: false, gfm: true });

// ── State ──────────────────────────────────────────────
let currentPath = null;
let totalFiles  = 0;

// ── Date Format ────────────────────────────────────────
function formatDate(d) {
  const y   = parseInt(d.slice(0, 4), 10);
  const m   = parseInt(d.slice(4, 6), 10);
  const day = parseInt(d.slice(6, 8), 10);
  const dow = ['일','월','화','수','목','금','토'][new Date(y, m - 1, day).getDay()];
  return `${m}월 ${day}일 (${dow})`;
}

// ── Render Sidebar ─────────────────────────────────────
function renderTree(groups) {
  const tree = $('file-tree');
  tree.innerHTML = '';
  totalFiles = groups.reduce((s, g) => s + g.files.length, 0);
  $('header-count').textContent = `${totalFiles}개`;

  if (!totalFiles) {
    tree.innerHTML = '<div class="no-files">요약 파일이 없습니다</div>';
    return;
  }

  groups.forEach(group => {
    const groupEl = document.createElement('div');
    groupEl.className = 'date-group';
    groupEl.dataset.date = group.date;

    const chevronId = `chev-${group.date}`;
    const listId    = `list-${group.date}`;

    const headerEl = document.createElement('div');
    headerEl.className = 'date-header';
    headerEl.innerHTML =
      `<span class="chevron" id="${chevronId}">▾</span>` +
      `<span class="date-label">${formatDate(group.date)}</span>` +
      `<span class="date-count" id="cnt-${group.date}">${group.files.length}</span>`;

    const listEl = document.createElement('div');
    listEl.className = 'file-list';
    listEl.id = listId;

    group.files.forEach(file => {
      const itemEl = document.createElement('div');
      itemEl.className = 'file-item';
      itemEl.dataset.path  = file.path;
      itemEl.dataset.query = file.title.toLowerCase();
      itemEl.textContent   = file.title;
      itemEl.title         = file.title;
      itemEl.addEventListener('click', () => selectFile(file.path, itemEl));
      listEl.appendChild(itemEl);
    });

    headerEl.addEventListener('click', () => {
      const hidden = listEl.style.display === 'none';
      listEl.style.display = hidden ? '' : 'none';
      const chev = $(chevronId);
      chev.classList.toggle('collapsed', !hidden);
    });

    groupEl.appendChild(headerEl);
    groupEl.appendChild(listEl);
    tree.appendChild(groupEl);
  });
}

// ── Filter ─────────────────────────────────────────────
function filterTree(q) {
  q = q.toLowerCase().trim();
  document.querySelectorAll('.date-group').forEach(group => {
    let vis = 0;
    group.querySelectorAll('.file-item').forEach(item => {
      const match = !q || item.dataset.query.includes(q);
      item.style.display = match ? '' : 'none';
      if (match) vis++;
    });
    group.style.display = vis ? '' : 'none';

    const cntEl = group.querySelector('.date-count');
    if (cntEl) cntEl.textContent = vis;

    if (q) {
      const listEl = group.querySelector('.file-list');
      if (listEl) listEl.style.display = '';
      const chevEl = group.querySelector('.chevron');
      if (chevEl) chevEl.classList.remove('collapsed');
    }
  });
}

// ── Select File ────────────────────────────────────────
async function selectFile(path, itemEl) {
  if (path === currentPath) return;
  currentPath = path;

  document.querySelectorAll('.file-item.active')
    .forEach(el => el.classList.remove('active'));
  if (itemEl) itemEl.classList.add('active');

  $('empty-state').style.display = 'none';
  $('md-wrap').style.display = 'block';
  $('md-body').innerHTML = '<p class="md-loading">불러오는 중…</p>';

  try {
    const res  = await fetch('/summary/content', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ path }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    $('md-body').innerHTML = marked.parse(data.content);
    $('content').scrollTop = 0;
  } catch (e) {
    $('md-body').innerHTML = `<p class="md-error">오류: ${e.message}</p>`;
  }
}

// ── Init ───────────────────────────────────────────────
async function init() {
  try {
    const res  = await fetch('/summary/list');
    const data = await res.json();
    renderTree(data.groups || []);
  } catch (e) {
    $('file-tree').innerHTML =
      '<div class="no-files">목록을 불러올 수 없습니다</div>';
  }
}

// ── Search ─────────────────────────────────────────────
$('search').addEventListener('input', e => filterTree(e.target.value));
$('search').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.target.value = ''; filterTree(''); }
});

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
